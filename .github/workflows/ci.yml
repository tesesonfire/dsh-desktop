name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: node build / test / audit (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm audit:contract

  electron-smoke:
    name: electron clean-boot smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm smoke:clean-boot:electron

  rust:
    name: rust clippy / test / build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri
      - name: clippy
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo clippy -- -D warnings
      - name: test
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo test
      - name: build
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo build
      - name: tauri smoke (DSH_E2E lifecycle)
        working-directory: apps/desktop-tauri/src-tauri
        env:
          DSH_E2E: '1'
        run: cargo test --test lifecycle
