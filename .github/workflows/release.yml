name: Release

on:
  push:
    tags: ['v*']

jobs:
  electron:
    name: electron artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: electron-builder (unsigned; publish skipped — no feed yet)
        working-directory: apps/desktop-electron
        env:
          # TODO(release-infra): code signing + auto-update feed require
          # certificates and a GH_TOKEN-published latest.yml — see HANDOFF.md.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: |
            apps/desktop-electron/release/*.exe
            apps/desktop-electron/release/*.dmg
            apps/desktop-electron/release/*.AppImage
            apps/desktop-electron/release/*.deb
          if-no-files-found: warn

  tauri:
    permissions:
      contents: write
    name: tauri artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop-tauri build
      - name: tauri build (unsigned bundles)
        working-directory: apps/desktop-tauri
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}
          path: |
            apps/desktop-tauri/src-tauri/target/release/bundle/**/*.exe
            apps/desktop-tauri/src-tauri/target/release/bundle/**/*.msi
            apps/desktop-tauri/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop-tauri/src-tauri/target/release/bundle/**/*.app.tar.gz
            apps/desktop-tauri/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop-tauri/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn
